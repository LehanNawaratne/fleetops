spring:
  application:
    name: fleetops

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fleetops}
    username: ${SPRING_DATASOURCE_USERNAME:fleetops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetops_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
