spring.application.name=fleetops

# JDBC datasource settings - update with your PostgreSQL values
spring.datasource.url=jdbc:postgresql://localhost:5432/fleetops
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Hibernate DDL auto to create/update tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
